apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-management-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: ghcr.io/skit-devops-2026/devops-24eskcs063:latest
        ports:
        - containerPort: 80
